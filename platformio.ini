; Automated Indoor Plant Care System — CSE 4102, Section A, Group 09
;
;   Firmware:         pio run -t upload -t monitor
;   Component test:   pio run -e test_soil -t upload -t monitor
;   Logic unit tests: pio test -e native

[platformio]
default_envs = app

; Shared by every ESP32 env below
[esp32]
platform = espressif32@7.1.3
board = esp32doit-devkit-v1
framework = arduino
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
upload_speed = 921600
; project include/ (plant_config.h, secrets.h) is also needed by lib/drivers
build_flags = -I include
lib_deps =
    knolleary/PubSubClient@^2.8
    bblanchon/ArduinoJson@^7.2.0
    adafruit/DHT sensor library@^1.4.6
    adafruit/Adafruit Unified Sensor@^1.1.14
    arduino-libraries/LiquidCrystal@^1.0.7

; Main firmware
[env:app]
extends = esp32
build_src_filter = +<app/>

; Pure-logic unit tests (lib/plantlogic), run on this computer
[env:native]
platform = native
test_framework = unity
lib_ignore = drivers

; Hardware tests: one sketch per component, also used for calibration
[env:test_outputs]
extends = esp32
build_src_filter = +<hwtest/outputs.cpp>

[env:test_lcd]
extends = esp32
build_src_filter = +<hwtest/lcd.cpp>

[env:test_dht]
extends = esp32
build_src_filter = +<hwtest/dht.cpp>

[env:test_ldr]
extends = esp32
build_src_filter = +<hwtest/ldr.cpp>

[env:test_soil]
extends = esp32
build_src_filter = +<hwtest/soil.cpp>

[env:test_tank]
extends = esp32
build_src_filter = +<hwtest/tank.cpp>

[env:test_relay]
extends = esp32
build_src_filter = +<hwtest/relay.cpp>
